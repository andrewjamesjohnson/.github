<svg xmlns="http://www.w3.org/2000/svg" width="880" height="624" viewBox="0 0 880 624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Loop Engineering: how my systems run</title><desc id="d">Sources, agents, checks, a person's sign off, output and results, with a fix loop, a day loop and a week loop sending results back, and the five parts that keep every step on track.</desc><defs><marker id="m1A4E9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A4E9A"/></marker></defs><defs><marker id="m0B1F33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B1F33"/></marker></defs><rect x="0.5" y="0.5" width="879" height="623" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/><text x="40" y="40" font-size="12.5" font-weight="600" fill="#7A8594" text-anchor="start">Loop Engineering</text><text x="40" y="70" font-size="21" font-weight="700" fill="#0B1F33" text-anchor="start">How my systems run</text><text x="40" y="94" font-size="13.5" font-weight="400" fill="#4A5565" text-anchor="start">The loop under The Clip Factory and Mac Studio Prepared, from the first source to the measured result.</text><line x1="40" y1="112" x2="840" y2="112" stroke="#0B1F33" stroke-width="1"/><rect x="40.0" y="176" width="120.0" height="118" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="54.0" y="202" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">1</text><text x="70.0" y="202" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Sources</text><text x="54.0" y="221" font-size="12" font-weight="400" fill="#7A8594" text-anchor="start">code</text><text x="54.0" y="246" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Filings, prices,</text><text x="54.0" y="263" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">news, streams</text><text x="54.0" y="280" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">and hearings.</text><line x1="161.0" y1="235.0" x2="175.0" y2="235.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="176.0" y="176" width="120.0" height="118" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="190.0" y="202" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">2</text><text x="206.0" y="202" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Agents</text><text x="190.0" y="221" font-size="12" font-weight="400" fill="#7A8594" text-anchor="start">AI agents</text><text x="190.0" y="246" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Each role</text><text x="190.0" y="263" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">follows its own</text><text x="190.0" y="280" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">written workflow.</text><line x1="297.0" y1="235.0" x2="311.0" y2="235.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="312.0" y="176" width="120.0" height="118" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="326.0" y="202" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">3</text><text x="342.0" y="202" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Checks</text><text x="326.0" y="221" font-size="12" font-weight="400" fill="#7A8594" text-anchor="start">code</text><text x="326.0" y="246" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Every rule is</text><text x="326.0" y="263" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">a test in code,</text><text x="326.0" y="280" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">pass or fail.</text><line x1="433.0" y1="235.0" x2="447.0" y2="235.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="448.0" y="176" width="120.0" height="118" rx="3" fill="#0B2545" stroke="#0B2545" stroke-width="1"/><text x="462.0" y="202" font-size="12" font-weight="700" fill="#9FB0C4" text-anchor="start">4</text><text x="478.0" y="202" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="start">Approval</text><text x="462.0" y="221" font-size="12" font-weight="400" fill="#9FB0C4" text-anchor="start">a person</text><text x="462.0" y="246" font-size="12.5" font-weight="400" fill="#C9D3E0" text-anchor="start">Signs off on</text><text x="462.0" y="263" font-size="12.5" font-weight="400" fill="#C9D3E0" text-anchor="start">anything that</text><text x="462.0" y="280" font-size="12.5" font-weight="400" fill="#C9D3E0" text-anchor="start">matters.</text><line x1="569.0" y1="235.0" x2="583.0" y2="235.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="584.0" y="176" width="120.0" height="118" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="598.0" y="202" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">5</text><text x="614.0" y="202" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Output</text><text x="598.0" y="221" font-size="12" font-weight="400" fill="#7A8594" text-anchor="start">code</text><text x="598.0" y="246" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Clips, research</text><text x="598.0" y="263" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">notes and</text><text x="598.0" y="280" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">trade plans.</text><line x1="705.0" y1="235.0" x2="719.0" y2="235.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="720.0" y="176" width="120.0" height="118" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="734.0" y="202" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">6</text><text x="750.0" y="202" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Results</text><text x="734.0" y="221" font-size="12" font-weight="400" fill="#7A8594" text-anchor="start">code</text><text x="734.0" y="246" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Real outcomes:</text><text x="734.0" y="263" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">views, returns,</text><text x="734.0" y="280" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">time saved.</text><path d="M780.0,174 L780.0,150 L372.0,150 L372.0,173" fill="none" stroke="#1A4E9A" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#m1A4E9A)"/><text x="576.0" y="141" font-size="12.5" font-weight="700" fill="#1A4E9A" text-anchor="middle">Week loop</text><path d="M354.0,296 L354.0,318 L254.0,318 L254.0,297" fill="none" stroke="#1A4E9A" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#m1A4E9A)"/><text x="304.0" y="336" font-size="12.5" font-weight="700" fill="#1A4E9A" text-anchor="middle">Fix loop</text><path d="M780.0,296 L780.0,348 L212.0,348 L212.0,297" fill="none" stroke="#1A4E9A" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#m1A4E9A)"/><text x="644.0" y="339" font-size="12.5" font-weight="700" fill="#1A4E9A" text-anchor="middle">Day loop</text><text x="40.0" y="394" font-size="13" font-weight="700" fill="#1A4E9A">Fix loop<tspan font-weight="400" fill="#7A8594">  ·  minutes</tspan></text><text x="40.0" y="415" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">A failed check goes back to be</text><text x="40.0" y="432" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">fixed, with the reason it failed.</text><text x="306.6666666666667" y="394" font-size="13" font-weight="700" fill="#1A4E9A">Day loop<tspan font-weight="400" fill="#7A8594">  ·  daily</tspan></text><text x="306.6666666666667" y="415" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">Results become the lessons the</text><text x="306.6666666666667" y="432" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">next run reads first.</text><text x="573.3333333333334" y="394" font-size="13" font-weight="700" fill="#1A4E9A">Week loop<tspan font-weight="400" fill="#7A8594">  ·  weekly</tspan></text><text x="573.3333333333334" y="415" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">Rule changes are replayed on past</text><text x="573.3333333333334" y="432" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">runs, then KEEP, NO EFFECT or ROLL BACK.</text><line x1="40" y1="462" x2="840" y2="462" stroke="#B8C0CC" stroke-width="1"/><text x="40" y="488" font-size="12.5" font-weight="600" fill="#7A8594" text-anchor="start">What keeps every step on track</text><text x="40.0" y="514" font-size="13.5" font-weight="700" fill="#0B1F33" text-anchor="start">Memory</text><text x="40.0" y="535" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">One shared board every</text><text x="40.0" y="552" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">step reads first and</text><text x="40.0" y="569" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">writes last.</text><text x="200.0" y="514" font-size="13.5" font-weight="700" fill="#0B1F33" text-anchor="start">Gates</text><text x="200.0" y="535" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">Code checks each rule</text><text x="200.0" y="552" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">and answers in fixed</text><text x="200.0" y="569" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">words.</text><text x="360.0" y="514" font-size="13.5" font-weight="700" fill="#0B1F33" text-anchor="start">Journal</text><text x="360.0" y="535" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">Every run leaves a line,</text><text x="360.0" y="552" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">so a crash picks up</text><text x="360.0" y="569" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">where it fell.</text><text x="520.0" y="514" font-size="13.5" font-weight="700" fill="#0B1F33" text-anchor="start">Replay</text><text x="520.0" y="535" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">Real past jobs rerun</text><text x="520.0" y="552" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">before any engine</text><text x="520.0" y="569" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">change ships.</text><text x="680.0" y="514" font-size="13.5" font-weight="700" fill="#0B1F33" text-anchor="start">Undo</text><text x="680.0" y="535" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">Every live change</text><text x="680.0" y="552" font-size="12.2" font-weight="400" fill="#4A5565" text-anchor="start">ships with a way back.</text><text x="40" y="606" font-size="11.5" font-weight="400" fill="#7A8594" text-anchor="start">Source: The Clip Factory and Mac Studio Prepared, November 2026. Blue: results going back in. Dark: a person.</text></svg>
