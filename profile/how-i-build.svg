<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How I build anything</title><desc id="d">Six steps that repeat: map, build the smallest loop, gate it in code, run in shadow, measure, keep or roll back.</desc><defs><marker id="m1A4E9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A4E9A"/></marker></defs><defs><marker id="m0B1F33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B1F33"/></marker></defs><rect x="0.5" y="0.5" width="879" height="469" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/><text x="40" y="40" font-size="12.5" font-weight="600" fill="#7A8594" text-anchor="start">Method</text><text x="40" y="70" font-size="21" font-weight="700" fill="#0B1F33" text-anchor="start">How each system gets built</text><text x="40" y="94" font-size="13.5" font-weight="400" fill="#4A5565" text-anchor="start">The same six steps on every project, repeated as results come in.</text><line x1="40" y1="112" x2="840" y2="112" stroke="#0B1F33" stroke-width="1"/><rect x="40.0" y="140" width="253.33333333333334" height="108" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="54.0" y="166" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">1</text><text x="72.0" y="166" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Map the process</text><text x="54.0" y="187" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">What comes in, what gets</text><text x="54.0" y="204" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">decided, what goes out</text><text x="54.0" y="221" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">and what checks it.</text><line x1="295.33333333333337" y1="194.0" x2="311.33333333333337" y2="194.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="313.33333333333337" y="140" width="253.33333333333334" height="108" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="327.33333333333337" y="166" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">2</text><text x="345.33333333333337" y="166" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Build one path</text><text x="327.33333333333337" y="187" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">One working path, end</text><text x="327.33333333333337" y="204" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">to end, before adding</text><text x="327.33333333333337" y="221" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">anything else.</text><line x1="568.6666666666667" y1="194.0" x2="584.6666666666667" y2="194.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="586.6666666666667" y="140" width="253.33333333333334" height="108" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="600.6666666666667" y="166" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">3</text><text x="618.6666666666667" y="166" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Rules become checks</text><text x="600.6666666666667" y="187" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Each rule is a test in</text><text x="600.6666666666667" y="204" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">code with a fixed pass</text><text x="600.6666666666667" y="221" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">or fail answer.</text><rect x="40.0" y="268" width="253.33333333333334" height="108" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="54.0" y="294" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">4</text><text x="72.0" y="294" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Run in shadow</text><text x="54.0" y="315" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">It makes the call,</text><text x="54.0" y="332" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">nothing ships, and I</text><text x="54.0" y="349" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">compare it with mine.</text><line x1="295.33333333333337" y1="322.0" x2="311.33333333333337" y2="322.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="313.33333333333337" y="268" width="253.33333333333334" height="108" rx="3" fill="#FFFFFF" stroke="#B8C0CC" stroke-width="1"/><text x="327.33333333333337" y="294" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">5</text><text x="345.33333333333337" y="294" font-size="14.5" font-weight="700" fill="#0B1F33" text-anchor="start">Measure</text><text x="327.33333333333337" y="315" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Real outcomes only:</text><text x="327.33333333333337" y="332" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">returns, views, errors</text><text x="327.33333333333337" y="349" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">caught, time saved.</text><line x1="568.6666666666667" y1="322.0" x2="584.6666666666667" y2="322.0" stroke="#0B1F33" stroke-width="1.3" marker-end="url(#m0B1F33)"/><rect x="586.6666666666667" y="268" width="253.33333333333334" height="108" rx="3" fill="#FFFFFF" stroke="#1A4E9A" stroke-width="1.5"/><text x="600.6666666666667" y="294" font-size="12" font-weight="700" fill="#7A8594" text-anchor="start">6</text><text x="618.6666666666667" y="294" font-size="14.5" font-weight="700" fill="#1A4E9A" text-anchor="start">Keep or roll back</text><text x="600.6666666666667" y="315" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">Every change ends</text><text x="600.6666666666667" y="332" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">KEEP, NO EFFECT</text><text x="600.6666666666667" y="349" font-size="12.5" font-weight="400" fill="#4A5565" text-anchor="start">or ROLL BACK.</text><path d="M713.3333333333334,250 L713.3333333333334,258 L166.66666666666669,258 L166.66666666666669,266" fill="none" stroke="#0B1F33" stroke-width="1.4" stroke-linejoin="miter" marker-end="url(#m0B1F33)"/><path d="M713.3333333333334,378 L713.3333333333334,398 L20,398 L20,194.0 L38,194.0" fill="none" stroke="#1A4E9A" stroke-width="1.6" stroke-linejoin="miter" marker-end="url(#m1A4E9A)"/><text x="440.0" y="420" font-size="13.5" font-weight="600" fill="#1A4E9A" text-anchor="middle">Results go into the next round of changes.</text></svg>
