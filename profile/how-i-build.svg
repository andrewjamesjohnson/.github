<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How I build anything</title><desc id="d">Six steps that repeat: map, build the smallest loop, gate it in code, run in shadow, measure, keep or roll back.</desc><defs><marker id="m1F45B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F45B8"/></marker></defs><defs><marker id="m111111" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="#F7F7F4" stroke="#DDDDDA"/><text x="40" y="48" font-size="11.5" font-weight="700" fill="#5E5E5E" text-anchor="start" letter-spacing="1.6">HOW I BUILD</text><text x="40" y="86" font-size="30" font-weight="700" fill="#111111" text-anchor="start">The same six steps, every project</text><text x="40" y="114" font-size="15" font-weight="400" fill="#5E5E5E" text-anchor="start">Built once, then improved every day by its own results.</text><rect x="40.0" y="140" width="253.33333333333334" height="108" rx="10" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="1"/><text x="56.0" y="168" font-size="11.5" font-weight="700" fill="#8C8C87" text-anchor="start" letter-spacing="1">01</text><text x="82.0" y="168" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Map it</text><text x="56.0" y="190" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">Data in, a decision,</text><text x="56.0" y="207" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">data out, a check.</text><text x="56.0" y="224" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">Where do parts meet?</text><line x1="295.33333333333337" y1="194.0" x2="311.33333333333337" y2="194.0" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/><rect x="313.33333333333337" y="140" width="253.33333333333334" height="108" rx="10" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="1"/><text x="329.33333333333337" y="168" font-size="11.5" font-weight="700" fill="#8C8C87" text-anchor="start" letter-spacing="1">02</text><text x="355.33333333333337" y="168" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Smallest loop</text><text x="329.33333333333337" y="190" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">One path that runs end</text><text x="329.33333333333337" y="207" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">to end today, even</text><text x="329.33333333333337" y="224" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">if it is ugly.</text><line x1="568.6666666666667" y1="194.0" x2="584.6666666666667" y2="194.0" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/><rect x="586.6666666666667" y="140" width="253.33333333333334" height="108" rx="10" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="1"/><text x="602.6666666666667" y="168" font-size="11.5" font-weight="700" fill="#8C8C87" text-anchor="start" letter-spacing="1">03</text><text x="628.6666666666667" y="168" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Gate it in code</text><text x="602.6666666666667" y="190" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">Every rule is a check</text><text x="602.6666666666667" y="207" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">that answers in fixed</text><text x="602.6666666666667" y="224" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">words. Never vibes.</text><rect x="40.0" y="268" width="253.33333333333334" height="108" rx="10" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="1"/><text x="56.0" y="296" font-size="11.5" font-weight="700" fill="#8C8C87" text-anchor="start" letter-spacing="1">04</text><text x="82.0" y="296" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Run in shadow</text><text x="56.0" y="318" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">It decides, nothing</text><text x="56.0" y="335" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">ships. I compare its</text><text x="56.0" y="352" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">calls to mine.</text><line x1="295.33333333333337" y1="322.0" x2="311.33333333333337" y2="322.0" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/><rect x="313.33333333333337" y="268" width="253.33333333333334" height="108" rx="10" fill="#FFFFFF" stroke="#BDBDB8" stroke-width="1"/><text x="329.33333333333337" y="296" font-size="11.5" font-weight="700" fill="#8C8C87" text-anchor="start" letter-spacing="1">05</text><text x="355.33333333333337" y="296" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Measure</text><text x="329.33333333333337" y="318" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">Real results only.</text><text x="329.33333333333337" y="335" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">Views, fills, returns,</text><text x="329.33333333333337" y="352" font-size="12.5" font-weight="400" fill="#5E5E5E" text-anchor="start">errors caught.</text><line x1="568.6666666666667" y1="322.0" x2="584.6666666666667" y2="322.0" stroke="#111111" stroke-width="1.4" marker-end="url(#m111111)"/><rect x="586.6666666666667" y="268" width="253.33333333333334" height="108" rx="10" fill="#EEF1FA" stroke="#1F45B8" stroke-width="1"/><text x="602.6666666666667" y="296" font-size="11.5" font-weight="700" fill="#8C8C87" text-anchor="start" letter-spacing="1">06</text><text x="628.6666666666667" y="296" font-size="15" font-weight="700" fill="#1F45B8" text-anchor="start">Keep or roll back</text><text x="602.6666666666667" y="318" font-size="12.5" font-weight="400" fill="#3D4F86" text-anchor="start">Every change ends</text><text x="602.6666666666667" y="335" font-size="12.5" font-weight="400" fill="#3D4F86" text-anchor="start">KEEP, NO EFFECT</text><text x="602.6666666666667" y="352" font-size="12.5" font-weight="400" fill="#3D4F86" text-anchor="start">or ROLL BACK.</text><path d="M713.3333333333334,250 L713.3333333333334,258 L166.66666666666669,258 L166.66666666666669,266" fill="none" stroke="#111111" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#m111111)"/><path d="M713.3333333333334,378 L713.3333333333334,398 L20,398 L20,194.0 L38,194.0" fill="none" stroke="#1F45B8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1F45B8)"/><text x="440.0" y="420" font-size="13.5" font-weight="600" fill="#1F45B8" text-anchor="middle">The loop runs again with what it learned.</text></svg>
