<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Andrew James Johnson</title><desc id="d">I build systems that run themselves. Finance student, applied AI builder.</desc><rect x="0.5" y="0.5" width="879" height="329" rx="16" fill="#F7F7F4" stroke="#DDDDDA"/><text x="40" y="52" font-size="11.5" font-weight="700" fill="#5E5E5E" text-anchor="start" letter-spacing="1.6">ANDREW JAMES JOHNSON</text><text x="40" y="104" font-size="40" font-weight="700" fill="#111111" text-anchor="start">I build systems that run</text><text x="40" y="152" font-size="40" font-weight="700" fill="#111111" text-anchor="start">themselves.</text><text x="40" y="190" font-size="15.5" font-weight="400" fill="#5E5E5E" text-anchor="start">Finance student and applied AI builder. I map a job as data in, a decision,</text><text x="40" y="212" font-size="15.5" font-weight="400" fill="#5E5E5E" text-anchor="start">data out and a check, then build the loop that does it every day.</text><line x1="40" y1="240" x2="840" y2="240" stroke="#BDBDB8" stroke-width="1"/><text x="40.0" y="284" font-size="30" font-weight="700" fill="#111111" text-anchor="start">1,435</text><text x="40.0" y="308" font-size="13.5" font-weight="400" fill="#5E5E5E" text-anchor="start">commits in 5 weeks</text><text x="240.0" y="284" font-size="30" font-weight="700" fill="#111111" text-anchor="start">6,222</text><text x="240.0" y="308" font-size="13.5" font-weight="400" fill="#5E5E5E" text-anchor="start">tests on one system</text><text x="440.0" y="284" font-size="30" font-weight="700" fill="#111111" text-anchor="start">51</text><text x="440.0" y="308" font-size="13.5" font-weight="400" fill="#5E5E5E" text-anchor="start">jobs on timers</text><text x="640.0" y="284" font-size="30" font-weight="700" fill="#1F45B8" text-anchor="start">1</text><text x="640.0" y="308" font-size="13.5" font-weight="400" fill="#5E5E5E" text-anchor="start">human in the loop: me</text></svg>
